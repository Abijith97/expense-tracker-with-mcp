name: Tests, coverage and demo APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: android-companion/python-tests/requirements-dev.txt
      - name: Install test tooling
        run: python -m pip install -r python-tests/requirements-dev.txt
      - name: Run offline tests with branch coverage
        run: python -m coverage run -m unittest discover -s python-tests -p "test_*.py" -v
      - name: Generate coverage reports
        if: always()
        run: |
          python -m coverage html --fail-under=0
          python -m coverage xml --fail-under=0
          python -m coverage json --fail-under=0
      - name: Check Python coverage threshold
        run: python -m coverage report
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ matrix.os }}
          path: android-companion/build/python-coverage/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android tests, coverage and APK
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Make room for the Android emulator
        # Only this disposable Linux runner: Android tests do not use .NET.
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h .
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # CLI 23 understands the API-major/minor SDK package metadata.
          cmdline-tools-version: '16111833'
          # The action default also requests the retired "tools" SDK package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build both variants and run lint
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Run Android tests with coverage
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          # Keep the AVD within hosted-runner resources after the APK builds.
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          working-directory: android-companion
          script: bash ./gradlew -Pcoverage=true :app:createDebugAndroidTestCoverageReport --console=plain
      - name: Rebuild demo APK without coverage instrumentation
        run: bash ./gradlew :app:assembleDebug --console=plain
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-coverage-and-lint
          path: |
            android-companion/app/build/reports/coverage/
            android-companion/app/build/reports/androidTests/
            android-companion/app/build/outputs/androidTest-results/
            android-companion/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - name: Deliver tested demo APK
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expense-tracker-demo-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
